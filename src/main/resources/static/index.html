<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Speech to Text</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Speech to Text</h1>

        <p>
            Record your voice and receive a full transcription.
        </p>

        <div class="controls">

            <button id="startButton">
                Start 
            </button>

            <button id="stopButton" disabled>
                Stop 
            </button>

        </div>

        <p id="status">
            Ready
        </p>

        <section>
            <h2>Transcription</h2>

            <div
                id="transcription"
                class="transcription"
                aria-live="polite"
            >
                Your transcription will appear here.
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
